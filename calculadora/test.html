<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tests — calculo.js</title>
<style>
  body { font-family: ui-monospace, "IBM Plex Mono", monospace; background: #10181f; color: #e9e2d3; padding: 24px; line-height: 1.6; }
  h1 { font-size: 18px; }
  .pass { color: #7ec98a; }
  .fail { color: #f0857a; font-weight: 700; }
  .resumen { font-size: 16px; margin-top: 16px; padding: 10px 14px; border-radius: 8px; display: inline-block; }
  .resumen.ok { background: #24361f; color: #b9d7a6; }
  .resumen.no { background: #402019; color: #f0b3a6; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Validación de calculo.js contra la planilla original (LibreOffice)</h1>
<pre id="out">cargando…</pre>

<script src="calculo.js"></script>
<script>
(function () {
  'use strict';
  var C = window.CalculoRIC;
  var out = [];
  var fallos = 0;

  function approx(a, b, tol) { return typeof a === 'number' && isFinite(a) && Math.abs(a - b) <= tol; }
  function check(nombre, obtenido, esperado, tol) {
    var ok = approx(obtenido, esperado, tol);
    if (!ok) fallos++;
    out.push((ok ? '  PASS ' : '  FAIL ') + nombre + '  →  obtenido=' + obtenido + '  esperado=' + esperado);
    return ok;
  }
  function info(t) { out.push(t); }
  function render() {
    var el = document.getElementById('out');
    el.innerHTML = out.map(function (l) {
      var cls = l.indexOf('PASS') >= 0 ? 'pass' : (l.indexOf('FAIL') >= 0 ? 'fail' : '');
      return cls ? '<span class="' + cls + '">' + l + '</span>' : l;
    }).join('\n') +
      '\n\n<span class="resumen ' + (fallos === 0 ? 'ok' : 'no') + '">' +
      (fallos === 0 ? 'TODOS LOS CASOS PASAN' : fallos + ' COMPROBACIÓN(ES) FALLAN') + '</span>';
  }

  fetch('tablas_ric.json').then(function (r) { return r.json(); }).then(function (TABLAS) {

    // ---- Caso 1: Caída de tensión — monofásico ----
    // R=4.61 Ω/km viene de lo que era la Tabla N°4.1 (sección 4mm², cobre
    // concéntrico/compacto) — esa tabla ya no existe en tablas_ric.json, R es
    // ahora un dato de entrada directo. Se usa el mismo valor para no perder
    // el caso de referencia original.
    info('Caso 1 — Caída de tensión (monofásico, I=20A, cosφ=0.95, L=15m, R=4.61 Ω/km)');
    var r1 = C.caidaTension({
      sistema: 'Monofásico', I: 20, cosPhi: 0.95, L_m: 15,
      R_ohm_km: 4.61,
      caidaAcumuladaArriba_pct: 0
    }, TABLAS);
    check('V', r1.V, 220, 1e-9);
    check('R [Ω/km]', r1.R_ohm_km, 4.61, 1e-9);
    check('ΔV [V]', r1.deltaV_V, 2.6277, 1e-4);
    check('ΔV %', r1.deltaV_pct, 1.19441, 1e-4);
    info('  ' + (r1.cumpleTramo && r1.cumpleTotal ? 'PASS' : 'FAIL') + ' cumple tramo (≤3%) y total (≤5%)');
    if (!(r1.cumpleTramo && r1.cumpleTotal)) fallos++;

    // ---- Caso 2: Selección de conductor ----
    info('');
    info('Caso 2 — Selección de conductor (I=15A, 90°C, método A1, 3 activos, 30°C, Alimentadores)');
    var r2 = C.seleccionConductor({
      I_diseno: 15, familia: '90°C', metodo: 'A1', nConductores: 3,
      tempAmbiente: 30, tipoCircuito: 'Alimentadores'
    }, TABLAS);
    check('fn', r2.fn, 1, 1e-9);
    check('ft', r2.ft, 1, 1e-9);
    check('sección mínima por ampacidad [mm²]', r2.seccionMinimaAmpacidad_mm2, 1.5, 1e-9);
    check('sección mínima normativa [mm²]', r2.seccionMinimaNormativa_mm2, 4, 1e-9);
    check('SECCIÓN A UTILIZAR [mm²]', r2.seccionAUtilizar_mm2, 4, 1e-9);

    // ---- Caso 3: Potencia / Corriente / Voltaje ----
    info('');
    info('Caso 3 — Potencia/Corriente/Voltaje (monofásico, V=220, cosφ=0.95, I=20A)');
    var r3 = C.potenciaCorrienteVoltaje({
      sistema: 'Monofásico', Vpersonalizada: 220, cosPhi: 0.95, I: 20
    }, TABLAS);
    check('φ [°]', r3.phi_grados, 18.1949, 1e-3);
    check('S [VA]', r3.S_VA, 4400, 1e-6);
    check('P [W]', r3.P_W, 4180, 1e-6);
    check('Q [VAR]', r3.Q_VAR, 1373.8996, 1e-3);

    // ---- Caso 4: la tensión sigue al tipo de sistema si no hay valor personalizado ----
    info('');
    info('Caso 4 — Cambiar de Monofásico (V=220) a Trifásico SIN tocar la tensión → debe pasar a 380V solo');
    var r4a = C.potenciaCorrienteVoltaje({ sistema: 'Monofásico', cosPhi: 0.95, I: 20 }, TABLAS);
    check('mono sin V personalizada → V', r4a.V, 220, 1e-9);
    var r4b = C.potenciaCorrienteVoltaje({ sistema: 'Trifásico', cosPhi: 0.95, I: 20 }, TABLAS);
    check('trifásico sin V personalizada → V', r4b.V, 380, 1e-9);
    check('trifásico marca tensión automática', r4b.tensionAutomatica ? 1 : 0, 1, 1e-9);
    // y si SÍ hay valor personalizado, se respeta y no lo pisa el tipo de sistema
    var r4c = C.potenciaCorrienteVoltaje({ sistema: 'Trifásico', Vpersonalizada: 400, cosPhi: 0.95, I: 20 }, TABLAS);
    check('trifásico con V personalizada 400 → V', r4c.V, 400, 1e-9);
    check('con V personalizada NO es automática', r4c.tensionAutomatica ? 1 : 0, 0, 1e-9);

    // ---- Caso 5: potencia aparente S sin cos(φ) ----
    info('');
    info('Caso 5 — Trifásico, S=10000 VA, sin cos(φ) → I = 10000/(√3·380), P y Q sin calcular');
    var r5 = C.potenciaCorrienteVoltaje({ sistema: 'Trifásico', S: 10000 }, TABLAS);
    check('V (automática trifásica)', r5.V, 380, 1e-9);
    check('S [VA]', r5.S_VA, 10000, 1e-9);
    check('I [A] = 10000/(√3·380)', r5.I_A, 15.19, 1e-2);
    check('P sin calcular (null)', r5.P_W === null ? 1 : 0, 1, 1e-9);
    check('Q sin calcular (null)', r5.Q_VAR === null ? 1 : 0, 1, 1e-9);
    check('marca faltaCosPhi', r5.faltaCosPhi ? 1 : 0, 1, 1e-9);
    check('fuente de la corriente = derivada de S', r5.fuenteCorriente === 'derivada de S' ? 1 : 0, 1, 1e-9);
    // con cos(φ) sí calcula P y Q, y S manda sobre I/P si están los tres
    var r5b = C.potenciaCorrienteVoltaje({ sistema: 'Trifásico', S: 10000, cosPhi: 0.9, I: 99, P: 99 }, TABLAS);
    check('S > P > I: usa S aunque I y P estén llenos', r5b.S_VA, 10000, 1e-9);
    check('con cos(φ)=0.9 → P = S·cosφ', r5b.P_W, 9000, 1e-9);

    // ---- Caso 6 (ex-A, tarea "R obligatoria"): sin R ni ρ no calcula ----
    info('');
    info('Caso 6 — R y ρ vacíos con el resto de los datos válidos → debe dar error, sin ΔV');
    var r6 = C.caidaTension({ sistema: 'Monofásico', I: 6.08, cosPhi: 0.97, L_m: 120 }, TABLAS);
    check('sin R ni ρ → hay error', typeof r6.error === 'string' ? 1 : 0, 1, 1e-9);
    check('sin R ni ρ → NO hay deltaV_V', r6.deltaV_V === undefined ? 1 : 0, 1, 1e-9);

    // ---- Caso 7 (ex-B): caída de tensión monofásica con R manual ----
    info('');
    info('Caso 7 — Monofásico, I=6.08A, cosφ=0.97, L=120m, R=4.8 Ω/km → ΔV=6.794V');
    var r7 = C.caidaTension({ sistema: 'Monofásico', I: 6.08, cosPhi: 0.97, L_m: 120, R_ohm_km: 4.8 }, TABLAS);
    check('ΔV [V]', r7.deltaV_V, 6.794, 1e-3);

    // ---- Caso 8 (ex-C): mismo caso en trifásico — confirma que el factor √3 sigue aplicándose ----
    info('');
    info('Caso 8 — Trifásico, I=6.08A, cosφ=0.97, L=120m, R=4.8 Ω/km → ΔV=5.884V');
    var r8 = C.caidaTension({ sistema: 'Trifásico', I: 6.08, cosPhi: 0.97, L_m: 120, R_ohm_km: 4.8 }, TABLAS);
    check('ΔV [V]', r8.deltaV_V, 5.884, 1e-3);

    // ---- Tarea "ρ + sección": Caso A — ni R ni ρ ----
    info('');
    info('Caso A (ρ) — R y ρ vacíos → error de validación, no calcula');
    var rhoA = C.caidaTension({ sistema: 'Monofásico', I: 6.08, cosPhi: 0.97, L_m: 120 }, TABLAS);
    check('hay error', typeof rhoA.error === 'string' ? 1 : 0, 1, 1e-9);
    check('mensaje pide R o ρ', /resistencia.*ρ|ρ.*resistencia/i.test(rhoA.error || '') ? 1 : 0, 1, 1e-9);

    // ---- Caso B (ρ) — ρ sin sección ----
    info('');
    info('Caso B (ρ) — ρ=0.01724 sin sección → error pidiendo la sección, no asume nada');
    var rhoB = C.caidaTension({ sistema: 'Monofásico', I: 6.08, cosPhi: 0.97, L_m: 120, rho: 0.01724 }, TABLAS);
    check('hay error', typeof rhoB.error === 'string' ? 1 : 0, 1, 1e-9);
    check('mensaje pide la sección', /sección/i.test(rhoB.error || '') ? 1 : 0, 1, 1e-9);
    check('NO calcula deltaV_V', rhoB.deltaV_V === undefined ? 1 : 0, 1, 1e-9);

    // ---- Caso C (ρ) — R directa (regresión de la tarea anterior) ----
    info('');
    info('Caso C (ρ) — Monofásico, I=6.08A, cosφ=0.97, L=120m, R=4.8 Ω/km → ΔV=6.794V');
    var rhoC = C.caidaTension({ sistema: 'Monofásico', I: 6.08, cosPhi: 0.97, L_m: 120, R_ohm_km: 4.8 }, TABLAS);
    check('R = la ingresada', rhoC.R_ohm_km, 4.8, 1e-9);
    check('ΔV [V]', rhoC.deltaV_V, 6.794, 1e-3);
    check('fuenteR = ingresada', rhoC.fuenteR === 'ingresada' ? 1 : 0, 1, 1e-9);

    // ---- Caso D (ρ) — vía ρ + sección, sin R ----
    info('');
    info('Caso D (ρ) — Monofásico, I=6.08A, cosφ=0.97, L=120m, ρ=0.01724, S=5.26 → R=3.278, ΔV=4.639V');
    var rhoD = C.caidaTension({ sistema: 'Monofásico', I: 6.08, cosPhi: 0.97, L_m: 120, rho: 0.01724, seccion_mm2: 5.26 }, TABLAS);
    check('R calculada = ρ/S×1000', rhoD.R_ohm_km, 3.278, 1e-3);
    check('ΔV [V]', rhoD.deltaV_V, 4.639, 1e-3);
    check('fuenteR = calculada de ρ y S', rhoD.fuenteR === 'calculada de ρ y S' ? 1 : 0, 1, 1e-9);

    // ---- Confirmación: si llenás R y ρ a la vez, R manda (no ρ) ----
    info('');
    info('Confirmación — R y ρ juntos → el resultado es el del Caso C (R manda), no el del Caso D');
    var rhoManda = C.caidaTension({ sistema: 'Monofásico', I: 6.08, cosPhi: 0.97, L_m: 120, R_ohm_km: 4.8, rho: 0.01724, seccion_mm2: 5.26 }, TABLAS);
    check('R usada = 4.8 (la directa, no la de ρ)', rhoManda.R_ohm_km, 4.8, 1e-9);
    check('ΔV coincide con Caso C (6.794V), no con Caso D (4.639V)', rhoManda.deltaV_V, 6.794, 1e-3);
    check('fuenteR = ingresada (ρ se ignoró)', rhoManda.fuenteR === 'ingresada' ? 1 : 0, 1, 1e-9);

    // ---- Confirmación: Tabla 4.1 fuera, Tabla 4.4 (ampacidad) intacta ----
    info('');
    info('Confirmación — Tabla N°4.1 eliminada de tablas_ric.json; Tabla N°4.4 (ampacidad) intacta');
    check('tabla_4_1_resistencia_cc_20c ya NO existe', TABLAS.tabla_4_1_resistencia_cc_20c === undefined ? 1 : 0, 1, 1e-9);
    check('tabla_4_4_70c_ampacidad sigue presente', Array.isArray(TABLAS.tabla_4_4_70c_ampacidad && TABLAS.tabla_4_4_70c_ampacidad.filas) ? 1 : 0, 1, 1e-9);
    check('tabla_4_4_90c_ampacidad sigue presente', Array.isArray(TABLAS.tabla_4_4_90c_ampacidad && TABLAS.tabla_4_4_90c_ampacidad.filas) ? 1 : 0, 1, 1e-9);
    check('tabla_4_4_90c_ampacidad conserva sus 34 filas', (TABLAS.tabla_4_4_90c_ampacidad || {}).filas ? TABLAS.tabla_4_4_90c_ampacidad.filas.length : 0, 34, 1e-9);
    // Selección de conductor sigue funcionando sin cambios (mismo caso de referencia original)
    var r2check = C.seleccionConductor({ I_diseno: 15, familia: '90°C', metodo: 'A1', nConductores: 3, tempAmbiente: 30, tipoCircuito: 'Alimentadores' }, TABLAS);
    check('Selección de conductor no se rompió (SECCIÓN A UTILIZAR)', r2check.seccionAUtilizar_mm2, 4, 1e-9);

    render();
  }).catch(function (e) {
    document.getElementById('out').textContent =
      'No se pudo cargar tablas_ric.json (' + e.message + ').\n' +
      'Abrí esta página servida por un servidor web (no como archivo local):\n' +
      '  powershell -ExecutionPolicy Bypass -File serve.ps1\n' +
      '  y entrá a  http://localhost:<puerto>/calculadora/test.html  (el puerto lo imprime serve.ps1)';
  });
})();
</script>
</body>
</html>
